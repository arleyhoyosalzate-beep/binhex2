<div class="conversion-selector">
  <label for="conversion-type">Conversión</label>

  <select id="conversion-type" (change)="handleSelection($event)">
    @for (option of options; track option.value) {
      <option [value]="option.value" [selected]="option.value === selectedConversion()">
        {{ option.label }}
      </option>
    }
  </select>
</div>
