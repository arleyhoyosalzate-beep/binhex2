<nav class="conversion-selector" aria-label="Seleccionar tipo de conversión">
  <p class="conversion-selector__title">Selecciona una conversión</p>

  <div class="conversion-selector__buttons">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="conversion-option"
        [class.conversion-option--active]="option.value === selectedConversion()"
        [attr.aria-label]="option.label"
        [attr.aria-pressed]="option.value === selectedConversion()"
        [attr.data-conversion]="option.value"
        (click)="selectConversion(option.value)"
      >
        {{ option.abbreviation }}
      </button>
    }
  </div>
</nav>
