<main>
  <h1>Conversor de sistemas numéricos</h1>

  <ng-template
    #conversionRow
    let-inputLabel="inputLabel"
    let-inputId="inputId"
    let-inputValue="inputValue"
    let-resultLabel="resultLabel"
    let-resultValue="resultValue"
    let-onValueChange="valueChange"
  >
    <div class="conversion-row">
      <app-number-input
        [label]="inputLabel"
        [inputId]="inputId"
        [value]="inputValue"
        (valueChange)="onValueChange($event)"
      />

      <span class="connector" aria-hidden="true">→</span>

      <app-conversion-result
        [label]="resultLabel"
        [value]="resultValue"
      />
    </div>
  </ng-template>

  <ng-container
    [ngTemplateOutlet]="conversionRow"
    [ngTemplateOutletContext]="{
      inputLabel: 'Binario',
      inputId: 'binary-to-hex-input',
      inputValue: binaryToHexValue(),
      resultLabel: 'Hexadecimal',
      resultValue: hexadecimalResult(),
      valueChange: updateBinaryToHexValue,
    }"
  />

  <ng-container
    [ngTemplateOutlet]="conversionRow"
    [ngTemplateOutletContext]="{
      inputLabel: 'Binario',
      inputId: 'binary-to-decimal-input',
      inputValue: binaryToDecimalValue(),
      resultLabel: 'Decimal',
      resultValue: decimalResult(),
      valueChange: updateBinaryToDecimalValue,
    }"
  />
</main>
