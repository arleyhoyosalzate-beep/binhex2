<main>
  <h1>Conversor de sistemas numéricos</h1>

  <app-conversion-selector
    [selectedConversion]="selectedConversion()"
    (selectedConversionChange)="changeConversion($event)"
  />

  <ng-template
    #conversionRow
    let-inputLabel="inputLabel"
    let-inputId="inputId"
    let-inputValue="inputValue"
    let-resultLabel="resultLabel"
    let-resultValue="resultValue"
    let-onValueChange="valueChange"
  >
    <div class="conversion-row">
      <app-number-input
        [label]="inputLabel"
        [inputId]="inputId"
        [value]="inputValue"
        (valueChange)="onValueChange($event)"
      />

      <span class="connector" aria-hidden="true">→</span>

      <app-conversion-result [label]="resultLabel" [value]="resultValue" />
    </div>
  </ng-template>

  @switch (selectedConversion()) {
    @case ('binary-to-hex') {
      <ng-container
        [ngTemplateOutlet]="conversionRow"
        [ngTemplateOutletContext]="{
          inputLabel: 'Binario',
          inputId: 'binary-to-hex-input',
          inputValue: binaryToHexValue(),
          resultLabel: 'Hexadecimal',
          resultValue: hexadecimalResult(),
          valueChange: updateBinaryToHexValue,
        }"
      />
    }

    @case ('binary-to-decimal') {
      <ng-container
        [ngTemplateOutlet]="conversionRow"
        [ngTemplateOutletContext]="{
          inputLabel: 'Binario',
          inputId: 'binary-to-decimal-input',
          inputValue: binaryToDecimalValue(),
          resultLabel: 'Decimal',
          resultValue: decimalResult(),
          valueChange: updateBinaryToDecimalValue,
        }"
      />
    }

    @case ('decimal-to-binary') {
      <ng-container
        [ngTemplateOutlet]="conversionRow"
        [ngTemplateOutletContext]="{
          inputLabel: 'Decimal',
          inputId: 'decimal-to-binary-input',
          inputValue: decimalToBinaryValue(),
          resultLabel: 'Binario',
          resultValue: binaryResult(),
          valueChange: updateDecimalToBinaryValue,
        }"
      />
    }

    @case ('decimal-to-hex') {
      <ng-container
        [ngTemplateOutlet]="conversionRow"
        [ngTemplateOutletContext]="{
          inputLabel: 'Decimal',
          inputId: 'decimal-to-hex-input',
          inputValue: decimalToHexValue(),
          resultLabel: 'Hexadecimal',
          resultValue: decimalToHexResult(),
          valueChange: updateDecimalToHexValue,
        }"
      />
    }

    @case ('hex-to-binary') {
      <ng-container
        [ngTemplateOutlet]="conversionRow"
        [ngTemplateOutletContext]="{
          inputLabel: 'Hexadecimal',
          inputId: 'hex-to-binary-input',
          inputValue: hexToBinaryValue(),
          resultLabel: 'Binario',
          resultValue: hexToBinaryResult(),
          valueChange: updateHexToBinaryValue,
        }"
      />
    }
  }
</main>
